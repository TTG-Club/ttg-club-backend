# Этап 3, предметы (expand): описания магических предметов, снаряжения, доспехов и оружия (и особое
# свойство оружия) — из HTML в разметку core-api. Новые jsonb-колонки (массив строк-блоков, см.
# util/markup/HtmlToMarkupConverter) заполняются конвертером на Java; старые HTML-колонки удаляет 0028.
# Описание обязательно только у магических предметов; у остальных NULL — описания нет.
databaseChangeLog:
  - changeSet:
      id: 0027-items-markup-columns
      author: pg-migration
      changes:
        - sql:
            sql: >-
              ALTER TABLE artifactes ADD COLUMN description_markup jsonb;
              ALTER TABLE equipments ADD COLUMN description_markup jsonb;
              ALTER TABLE armors ADD COLUMN description_markup jsonb;
              ALTER TABLE weapons ADD COLUMN description_markup jsonb, ADD COLUMN special_markup jsonb
      rollback:
        - sql:
            sql: >-
              ALTER TABLE artifactes DROP COLUMN description_markup;
              ALTER TABLE equipments DROP COLUMN description_markup;
              ALTER TABLE armors DROP COLUMN description_markup;
              ALTER TABLE weapons DROP COLUMN description_markup, DROP COLUMN special_markup
  - changeSet:
      id: 0027-items-markup-convert
      author: pg-migration
      changes:
        - customChange:
            class: club.dnd5.portal.config.liquibase.MarkupColumnsChange
            table: artifactes
            columns: description>description_markup
        - customChange:
            class: club.dnd5.portal.config.liquibase.MarkupColumnsChange
            table: equipments
            columns: description>description_markup
        - customChange:
            class: club.dnd5.portal.config.liquibase.MarkupColumnsChange
            table: armors
            columns: description>description_markup
        - customChange:
            class: club.dnd5.portal.config.liquibase.MarkupColumnsChange
            table: weapons
            columns: description>description_markup, special>special_markup
        - sql:
            sql: >-
              UPDATE artifactes SET description_markup = '[]'::jsonb WHERE description_markup IS NULL;
              UPDATE equipments SET description_markup = NULL WHERE description_markup = '[]'::jsonb;
              UPDATE armors SET description_markup = NULL WHERE description_markup = '[]'::jsonb;
              UPDATE weapons SET description_markup = NULL WHERE description_markup = '[]'::jsonb;
              UPDATE weapons SET special_markup = NULL WHERE special_markup = '[]'::jsonb
      # колонки удаляет rollback предыдущего changeset'а
      rollback:
        - sql:
            sql: SELECT 1
