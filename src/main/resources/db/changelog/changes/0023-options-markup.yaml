# Этап 3, особенности классов (expand): описание — из HTML в разметку core-api.
# Новая jsonb-колонка (массив строк-блоков, см. util/markup/HtmlToMarkupConverter) заполняется
# конвертером на Java; старую HTML-колонку удаляет 0024.
databaseChangeLog:
  - changeSet:
      id: 0023-options-markup-column
      author: pg-migration
      changes:
        - sql:
            sql: ALTER TABLE options ADD COLUMN description_markup jsonb
      rollback:
        - sql:
            sql: ALTER TABLE options DROP COLUMN description_markup
  - changeSet:
      id: 0023-options-markup-convert
      author: pg-migration
      changes:
        - customChange:
            class: club.dnd5.portal.config.liquibase.MarkupColumnsChange
            table: options
            columns: description>description_markup
        - sql:
            sql: UPDATE options SET description_markup = '[]'::jsonb WHERE description_markup IS NULL
      # колонку удаляет rollback предыдущего changeset'а
      rollback:
        - sql:
            sql: SELECT 1
