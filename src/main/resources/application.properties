spring.application.name=dnd6.club
spring.main.banner-mode=off

spring.jpa.hibernate.ddl-auto= update

# Jackson 3 с прежними настройками Jackson 2: формат JSON для фронта не меняется.
spring.jackson.use-jackson2-defaults=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.use_sql_comments = true
spring.jpa.properties.hibernate.format_sql = true

server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=always

server.servlet.session.timeout = 30m
spring.profiles.active=local

#logging.level.org.springframework.security=DEBUG

auth-service.base-url=https://auth.api.ttg.club

# Таймауты обращения к SSO (/api/auth/me и т.д.). Без них зависший SSO копит потоки Tomcat.
auth-service.connect-timeout-ms=${AUTH_SERVICE_CONNECT_TIMEOUT_MS:2000}
auth-service.read-timeout-ms=${AUTH_SERVICE_READ_TIMEOUT_MS:4000}

# Кеш валидации токена. fresh-ttl — как долго токен не перепроверяется в SSO (снижает нагрузку);
# stale-ttl — до какого возраста провалидированный токен используется как fallback при
# недоступности SSO, чтобы транзиентный сбой (таймаут/5xx/429) не разлогинивал пользователя.
auth-service.cache.fresh-ttl-ms=${AUTH_SERVICE_CACHE_FRESH_TTL_MS:60000}
auth-service.cache.stale-ttl-ms=${AUTH_SERVICE_CACHE_STALE_TTL_MS:600000}
auth-service.cache.max-entries=${AUTH_SERVICE_CACHE_MAX_ENTRIES:20000}

# Сервис комментариев проксируется CommentsProxyController (/api/v1/comments/**).
# Дев-инстанса у сервиса нет — по умолчанию прод; переопределяется через
# COMMENTS_SERVICE_URL, если появится отдельный адрес.
comments-service.base-url=${COMMENTS_SERVICE_URL:https://comments.ttg.club}

# Межсервисный секрет для internal-ручки переименования автора (X-Service-Token).
# Тот же INTERNAL_SERVICE_SECRET, что задан в comments-service. Пусто — синхронизация
# имени в комментариях просто пропускается (best-effort).
comments-service.internal-token=${COMMENTS_SERVICE_INTERNAL_TOKEN:}

online.api.url=${ONLINE_API_URL:}
online.api.token=${ONLINE_API_TOKEN:}
online.site-id=${ONLINE_SITE_ID:5e14}

springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.displayRequestDuration=true

management.endpoints.web.exposure.include=*
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.[http.server.requests]=true

images.token.borders=/tokens/borders

# S3-хранилище загружаемых картинок (рамки токенов, галереи и обложки из мастерской). Пусто — загрузка выключена.
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.region=${S3_REGION:}
app.s3.bucket=${S3_BUCKET:}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.prefix=${S3_IMAGES_PREFIX:5e14}

# Картинки из мастерской: проверка и перекодирование в WebP (как на core-api).
# Больше max-width × max-height картинка не отклоняется, а уменьшается.
app.image.max-bytes=${IMAGE_MAX_BYTES:10485760}
app.image.max-width=${IMAGE_MAX_WIDTH:2048}
app.image.max-height=${IMAGE_MAX_HEIGHT:2048}
app.image.webp-quality=${IMAGE_WEBP_QUALITY:0.82}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.url=${APP_URL}
# Адрес картинок сайта: их раздаёт сам бэкенд по /s3/<ключ> (S3ImageController).
app.img.url=${APP_IMG_URL:/s3/${app.s3.prefix}}

allowed-origin-patterns=ttg.club,*.ttg.club
